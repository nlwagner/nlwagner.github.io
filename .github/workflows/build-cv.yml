name: Build and publish CV

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-cv:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout CV source
        uses: actions/checkout@v6

      - name: Compile CV
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          texlive_version: 2025

      - name: Checkout website repository
        uses: actions/checkout@v6
        with:
          repository: nlwagner/nlwagner.github.io
          ref: master
          token: ${{ secrets.WEBSITE_REPO_TOKEN }}
          path: website

      - name: Copy CV to website
        run: |
          cp main.pdf website/assets/pdf/CV.pdf

      - name: Commit updated CV
        run: |
          cd website

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/pdf/CV.pdf

          if git diff --cached --quiet; then
            echo "CV has not changed."
            exit 0
          fi

          git commit -m "Update CV"
          git push origin master
